# Publicação no Netlify: o Netlify roda o build e publica a pasta dist.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# O service worker do PWA precisa estar sempre atualizado.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
